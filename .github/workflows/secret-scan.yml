name: Secret guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify scanner redacts findings
        run: python3 scripts/test_check_secrets.py
      - name: Scan reachable Git history
        run: python3 scripts/check_secrets.py --history
